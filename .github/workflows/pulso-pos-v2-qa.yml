name: PULSO POS V2 — QA de ingeniería (sin despliegue)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/pos-v2/**'
      - 'scripts/quality/pulso-pos-v2-*'
      - 'docs/POS_V2_OFERTA_NATIVA.md'
      - 'package.json'
      - '.github/workflows/pulso-pos-v2-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate_quality:
    name: POS V2 — ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: npm run lint
          - check: typecheck
            command: npm run typecheck
          - check: build
            command: npm run build
          - check: demo
            command: npm run pos:v2:demo
    steps:
      - name: Checkout exacto del cambio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm

      - name: Dependencias fijas
        run: npm ci --ignore-scripts=false

      - name: Validar ${{ matrix.check }}
        run: ${{ matrix.command }}
